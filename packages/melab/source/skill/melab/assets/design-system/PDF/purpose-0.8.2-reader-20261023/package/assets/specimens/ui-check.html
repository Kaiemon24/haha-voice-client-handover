<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MELAB · Mục có ô kiểm</title><script>document.documentElement.dataset.specimenMode=new URLSearchParams(location.search).get("preview")==="canvas"?"preview":"standalone";</script><link rel="stylesheet" href="../native-layout.css"><link rel="stylesheet" href="../shadow47.css"></head><body class="asset-doc" data-canvas="1000x720" style="width:1000px;min-height:720px"><main class="ui-spec"><span class="label">MELAB / THÀNH PHẦN GIAO DIỆN</span><h1>Mục có ô kiểm</h1><section><fieldset><legend>Chuẩn bị cho buổi học</legend><label><input type="checkbox"> Đã đọc mục tiêu</label><p><label><input type="checkbox"> Đã chuẩn bị câu hỏi</label></p><label><input type="checkbox" disabled> Bước chưa mở</label></fieldset></section><p class="status" role="status" aria-live="polite">Thử thành phần bằng chuột hoặc bàn phím.</p><p class="example-note">Mẫu minh họa hành vi, không gửi hoặc lưu dữ liệu. Dùng Tab để kiểm tra vùng chọn; hộp thông tin đóng bằng Escape.</p></main><script>const result=document.querySelector('[role=status]');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='busy'){b.disabled=true;b.textContent='Đang thử…';requestAnimationFrame(()=>{b.disabled=false;b.textContent='Thử phản hồi';result.textContent='Đã hoàn tất thao tác mẫu; không gửi dữ liệu.'})}else result.textContent='Đã chọn: '+b.textContent});document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelector('[role=tabpanel]').textContent=b.dataset.panel});const search=document.querySelector('input[type=search]');if(search)search.oninput=()=>{let n=0;document.querySelectorAll('[data-row]').forEach(x=>{x.hidden=!x.textContent.toLocaleLowerCase('vi').includes(search.value.toLocaleLowerCase('vi'));if(!x.hidden)n++});result.textContent=n?n+' kết quả':'Chưa có kết quả phù hợp.'};const dlg=document.querySelector('dialog');if(dlg){let last;document.querySelector('[data-dialog]').onclick=e=>{last=e.currentTarget;dlg.showModal()};document.querySelector('[data-close]').onclick=()=>dlg.close();dlg.onclose=()=>last?.focus()};document.querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=()=>{result.textContent=x.checked?'Đã chọn bước học.':'Đã bỏ chọn bước học.'});document.querySelectorAll('form').forEach(x=>x.onsubmit=e=>{e.preventDefault();result.textContent='Đã nhận thao tác mẫu; không gửi dữ liệu.'});document.querySelectorAll('[role=tab]').forEach((b,i,all)=>{b.tabIndex=i===0?0:-1;b.addEventListener('click',()=>all.forEach(x=>x.tabIndex=x===b?0:-1));b.onkeydown=e=>{let n=e.key==='ArrowRight'?(i+1)%all.length:e.key==='ArrowLeft'?(i+all.length-1)%all.length:e.key==='Home'?0:e.key==='End'?all.length-1:null;if(n!==null){e.preventDefault();all[n].click();all[n].focus()}}});</script><script src="../sample-viewer-bridge.js?v=2b87665a9e31d0f2"></script><script src="../shadow47.js"></script><script src="../../body-keywords58.js" data-body-keyword-projection="58"></script></body></html>
