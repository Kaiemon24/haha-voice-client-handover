<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App · soạn yêu cầu</title><link rel="stylesheet" href="../native/layout.css"><main class=""><p class="eyebrow">LONG THÀNH / MẪU THIẾT KẾ</p><h1>Soạn yêu cầu đối chiếu</h1><form><label>Nhóm sản phẩm<select name="group"><option>Pallet</option><option>Sóng nhựa</option><option>Thùng lạnh</option></select></label><label>Kích thước cần dùng<input name="size" required placeholder="Ghi số và đơn vị"></label><label>Môi trường sử dụng<textarea name="context" required></textarea></label><button class="primary">Xem trước</button></form><section class="card" data-preview><h2>Bản xem trước</h2><p>Chưa có nội dung.</p></section><p role="status">Mẫu không gửi dữ liệu.</p></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=document.querySelector('[data-preview] p');p.textContent=f.get('group')+' · '+f.get('size')+' · '+f.get('context');document.querySelector('[role=status]').textContent='Nội dung chỉ có trong trang mẫu; chưa gửi.'};</script></html>
