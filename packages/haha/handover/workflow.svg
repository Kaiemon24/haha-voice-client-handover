<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" role="img" aria-label="Quy trình sáu bước"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17211b"/></marker></defs><rect x="20" y="10" width="620" height="58" rx="4" fill="#f4f5f3" stroke="#17211b" stroke-width="2"/><text x="330" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17211b">1. Yêu cầu trong thư mục đã chọn</text><path d="M330 69 V89" stroke="#17211b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="95" width="620" height="58" rx="4" fill="#f4f5f3" stroke="#17211b" stroke-width="2"/><text x="330" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17211b">2. Đọc HAHA hoặc Voice đi kèm</text><path d="M330 154 V174" stroke="#17211b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="180" width="620" height="58" rx="4" fill="#f4f5f3" stroke="#17211b" stroke-width="2"/><text x="330" y="217" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17211b">3. Chọn quy tắc và vật liệu</text><path d="M330 239 V259" stroke="#17211b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="265" width="620" height="58" rx="4" fill="#f4f5f3" stroke="#17211b" stroke-width="2"/><text x="330" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17211b">4. Dựng bản nháp từ dữ kiện thật</text><path d="M330 324 V344" stroke="#17211b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="350" width="620" height="58" rx="4" fill="#f4f5f3" stroke="#17211b" stroke-width="2"/><text x="330" y="387" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#17211b">5. Kiểm nội dung và đầu ra thực tế</text><path d="M330 409 V429" stroke="#17211b" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="435" width="620" height="58" rx="4" fill="#f4f5f3" stroke="#17211b" stroke-width="2"/><text x="330" y="472" text-anchor=